name: Node.js CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          test -s dist/index.js
          test "$(node dist/index.js)" = 'Hello world'
          output=$(mktemp)
          node dist/index.js --serve &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$output"' EXIT
          curl -fs --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 --output "$output" http://127.0.0.1:3000/
          test "$(cat "$output")" = 'Hello world'

      - name: Verify PM2 start and restart
        shell: bash
        run: |
          npm install --global pm2@7.1.2
          export PM2_HOME="$RUNNER_TEMP/pm2-test"
          trap 'pm2 kill >/dev/null 2>&1 || true' EXIT
          pm2 start dist/index.js --name sydorenko-node-ci -- --serve
          test "$(curl -fs --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:3000/)" = 'Hello world'
          pm2 restart sydorenko-node-ci
          test "$(curl -fs --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:3000/)" = 'Hello world'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-build
          path: dist/index.js
          if-no-files-found: error

  deploy:
    name: ${{ vars.EC2_HOST_KEY != '' && 'Deploy to Amazon EC2' || 'Deploy to Linux container' }}
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: deploy-node-app
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: node-build
          path: dist

      - name: Prepare SSH target
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_HOST_KEY: ${{ vars.EC2_HOST_KEY }}
        run: |
          umask 077
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -p "$ssh_dir"

          if [[ -n "$EC2_HOST_KEY" ]]; then
            : "${EC2_HOST:?Add the EC2_HOST Actions secret}"
            : "${EC2_USER:?Add the EC2_USER Actions secret}"
            : "${EC2_SSH_KEY_B64:?Add the EC2_SSH_KEY_B64 Actions secret}"
            if [[ ! "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ || ! "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
              printf '%s\n' 'Invalid EC2 host or SSH user.' >&2
              exit 1
            fi

            ssh_host="$EC2_HOST"
            ssh_user="$EC2_USER"
            ssh_port=22
            host_key="$EC2_HOST_KEY"
            printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > "$ssh_dir/deploy_key"
            printf '%s\n' 'Deployment target: Amazon EC2'
          else
            printf '%s\n' 'Deployment target: temporary Linux container'
            ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/deploy_key"
            ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/demo_host_key"

            docker build --tag node-ci-ssh-demo - <<'DOCKERFILE'
          FROM node:24-bookworm-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends openssh-server curl \
              && rm -rf /var/lib/apt/lists/* /etc/ssh/ssh_host_*_key* \
              && npm install --global pm2@7.1.2 \
              && install -d -m 0755 /run/sshd \
              && passwd -d node
          DOCKERFILE

            docker run --detach --rm --name node-ci-ssh-demo \
              --publish 127.0.0.1::22 \
              --mount "type=bind,source=$ssh_dir/deploy_key.pub,target=/run/deploy_key.pub,readonly" \
              --mount "type=bind,source=$ssh_dir/demo_host_key,target=/run/demo_host_key,readonly" \
              node-ci-ssh-demo bash -ec '
                install -d -o node -g node -m 0700 /home/node/.ssh
                install -o node -g node -m 0600 /run/deploy_key.pub /home/node/.ssh/authorized_keys
                exec /usr/sbin/sshd -D -e -h /run/demo_host_key \
                  -o UsePAM=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
                  -o AuthenticationMethods=publickey -o PermitRootLogin=no \
                  -o AllowUsers=node -o DisableForwarding=yes
              '

            ssh_host=127.0.0.1
            ssh_user=node
            published_address=$(docker port node-ci-ssh-demo 22/tcp)
            ssh_port=${published_address##*:}
            host_key=$(cat "$ssh_dir/demo_host_key.pub")
          fi

          read -r key_type key_data _ <<< "$host_key"
          if [[ "$key_type" != ssh-ed25519 || ! "$key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            printf '%s\n' 'Expected an ED25519 server public key.' >&2
            exit 1
          fi
          ssh-keygen -y -f "$ssh_dir/deploy_key" </dev/null >/dev/null
          printf 'deploy-target %s %s\n' "$key_type" "$key_data" > "$ssh_dir/known_hosts"

          cat > "$ssh_dir/config" <<EOF
          Host deploy-target
              HostName $ssh_host
              Port $ssh_port
              User $ssh_user
              IdentityFile "$ssh_dir/deploy_key"
              UserKnownHostsFile "$ssh_dir/known_hosts"
              HostKeyAlias deploy-target
              StrictHostKeyChecking yes
              HostKeyAlgorithms ssh-ed25519
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 15
          EOF

      - name: Copy build over SSH
        shell: bash
        run: |
          ssh_config="$RUNNER_TEMP/deploy-ssh/config"
          ssh -F "$ssh_config" -o ConnectionAttempts=5 deploy-target 'mkdir -p "$HOME/nodeapp/dist"'
          scp -F "$ssh_config" dist/index.js deploy-target:nodeapp/dist/index.next.js

      - name: Start app and verify HTTP
        shell: bash
        run: |
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy-target 'bash -se' <<'REMOTE'
          export PATH="/usr/local/bin:$PATH"
          cd "$HOME/nodeapp"
          command -v pm2 >/dev/null
          test "$(node dist/index.next.js)" = 'Hello world'
          mv dist/index.next.js dist/index.js

          if pm2 describe sydorenko-node-ci >/dev/null 2>&1; then
            pm2 restart sydorenko-node-ci
          else
            pm2 start dist/index.js --name sydorenko-node-ci -- --serve
          fi

          response=$(curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:3000/)
          test "$response" = 'Hello world'
          pm2 save
          printf 'HTTP health check passed: %s\n' "$response"
          REMOTE

      - name: Remove demo container
        if: ${{ always() && vars.EC2_HOST_KEY == '' }}
        run: docker rm --force node-ci-ssh-demo >/dev/null 2>&1 || true

      - name: Remove temporary SSH files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/deploy-ssh"
