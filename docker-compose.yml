services:
  app:
    build: .
    image: ${IMAGE_REPOSITORY:-nodeapp}:${IMAGE_TAG:-dev}
    init: true
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: nodeapp
      PGDATABASE: nodeapp
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodeapp
      POSTGRES_DB: nodeapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nodeapp -d nodeapp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
